name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Graph build uses only Node stdlib + fetch; tests do not require express
      - name: Build graph (fetches ASI catalog)
        run: npm run build-graph
      - name: Test
        run: npm test
      - name: Verify invariants
        # Invariants, NOT exact counts: the catalog is pinned (reproducible) but
        # may legitimately grow, so assert the properties that must always hold
        # rather than frozen totals that would break on any upstream addition.
        run: |
          node -e "
            const g=require('./data/threat-graph.json');
            console.log(JSON.stringify(g.counts,null,2));
            const fail=(m)=>{console.error('INVARIANT FAILED:',m);process.exit(1);};
            if (!(g.counts.nodes > 50)) fail('expected > 50 nodes');
            if (!(g.counts.edges > 50)) fail('expected > 50 edges');
            if (!(g.counts.asiNodes > 0)) fail('expected ASI nodes');
            if (!(g.counts.appNodes > 0)) fail('expected application nodes');
            if (!(g.counts.hypotheticalEdges >= 1)) fail('expected >= 1 hypothetical edge');
            // no POTENTIALLY_MATCHES edge may be presented as verified
            const bad = g.edges.filter(e => e.kind==='POTENTIALLY_MATCHES' && e.evidenceStatus!=='hypothetical');
            if (bad.length) { console.error(bad); fail('a POTENTIALLY_MATCHES edge was not hypothetical'); }
            // every node must carry provenance, every edge a source + evidenceStatus
            if (g.nodes.some(n => !(n.source || n.provenance))) fail('a node is missing provenance');
            if (g.edges.some(e => !e.source || !e.evidenceStatus)) fail('an edge is missing source/evidenceStatus');
            // provenance must record the pinned catalog ref + content hashes
            if (!g.sources?.asi?.ref) fail('missing pinned catalog ref in provenance');
            if (!g.sources?.asi?.contentHashes) fail('missing catalog content hashes in provenance');
            console.log('OK: invariants hold (pinned ref '+g.sources.asi.ref.slice(0,12)+', hypothetical-only cross edges, provenance present)');
          "
